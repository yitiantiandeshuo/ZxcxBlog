# Copy to wrangler.local.toml and replace the example resource names and ID.
name = "my-blog"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "my-blog-db"
database_id = "REPLACE-WITH-YOUR-D1-DATABASE-ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "my-blog-images"

[vars]
SITE_TITLE = "我的博客"
SITE_DESCRIPTION = "记录生活与思考。"
# Configure ACCESS_TEAM_DOMAIN, ACCESS_AUD and ADMIN_EMAIL as Worker secrets.
